  an unrelated placeholder glyph that was never updated to match the
  product's real identity. This is the same circular FAB mark used
  throughout the plugin and the public site: a solid accent-blue circle
  (#3b82f6, the default a11y-accent token - see styles.css) with the same
  accessibility figure glyph used by classes/icons.php::default_accessibility_svg()
  (pix/accessibility-default.svg, Ionicons, MIT - see thirdpartylibs.xml),
  scaled and centred to match the real FAB's icon-to-button proportion
  (26px icon inside a 56px circle, ~46%).
-->
