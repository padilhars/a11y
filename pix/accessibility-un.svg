<?xml version="1.0" encoding="UTF-8"?>
<!--
  "Accessibility logo (UN)" — International accessibility symbol used by the
  United Nations. Source: https://commons.wikimedia.org/wiki/File:Accessibility_logo.svg
  Original design: United Nations, Graphic Design Unit. Vectorization: Pablo
  Busatto (credited on the source page above).
  Licence: CC BY-SA 4.0 (Creative Commons Attribution-ShareAlike 4.0
  International) — see README.md for full attribution. Re-exported here with
  the class-based <style> block from the Illustrator SVG export replaced by
  equivalent inline presentation attributes (fill/stroke set directly on
  each <g>, using currentColor instead of the original export's fixed #fff
  so the icon themes like every other icon in classes/icons.php::PATHS -
  see classes/icons.php::un_accessibility_svg()) so the markup is safe to
  inline directly into a Moodle page: an SVG <style> block is NOT scoped to
  its own subtree once inlined into an HTML document, so generic class names
  like .st0/.st1 would apply page-wide and could clash with any other
  Illustrator-exported SVG already on the page. The path/circle geometry
  itself is unchanged from the source export.
-->
