name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        moodle-branch: ['MOODLE_500_STABLE', 'MOODLE_502_STABLE']
        database: ['pgsql', 'mariadb']

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout do plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      # Versão fixada diretamente (o plugin não versiona .nvmrc/package.json próprios -
      # o build AMD/grunt roda a partir do checkout do Moodle, não deste repositório).
      # 22.23.2 é a versão usada e verificada nas sessões de auditoria deste plugin.
      - name: Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Instalar moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci; pwd)/bin" >> $GITHUB_PATH
          echo "$(cd ci; pwd)/vendor/bin" >> $GITHUB_PATH

      - name: Instalar Moodle + plugin
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --moodle-branch ${{ matrix.moodle-branch }} \
            --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}

      - name: phplint
        run: moodle-plugin-ci phplint
      - name: phpcpd
        run: moodle-plugin-ci phpcpd
      - name: phpmd
        run: moodle-plugin-ci phpmd
      - name: codechecker (moodle-cs)
        run: moodle-plugin-ci codechecker
      - name: validate
        run: moodle-plugin-ci validate
      - name: savepoints
        run: moodle-plugin-ci savepoints
      - name: mustache
        run: moodle-plugin-ci mustache
      - name: grunt (eslint/stylelint/AMD build)
        run: moodle-plugin-ci grunt
      - name: phpunit
        run: moodle-plugin-ci phpunit
      - name: behat
        run: moodle-plugin-ci behat --profile chrome
