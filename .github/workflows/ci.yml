name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        # PHP 8.2 removido: o composer.json do próprio core do Moodle (5.0 e 5.2)
        # já exige PHP >=8.3 - confirmado numa execução real do CI (D66).
        php: ['8.3', '8.4']
        # MOODLE_500_STABLE removido: version.php:$plugin->supported passou a
        # declarar só 502 depois que esta mesma matriz de CI provou, contra a
        # branch real, que o core 5.0 nunca chega na build que $plugin->requires
        # exige - o plugin nem instala nela. Ver DECISIONS.md D66.
        moodle-branch: ['MOODLE_502_STABLE']
        database: ['pgsql', 'mariadb']

    services:
      postgres:
        # Moodle 5.2 exige Postgres 16+ ("[System] version 16 is required and
        # you are running 14.24" - confirmado por log real). D69.
        image: postgres:16
        env:
          # 'postgres' - confirmado por log real que "moodle-plugin-ci install"
          # conecta como esse usuário por padrão para DB=pgsql (não hardcoded
          # em nenhum lugar deste workflow). Uma tentativa anterior, sem
          # evidência, trocou para 'root' por analogia com o padrão oficial -
          # isso quebrou a role que o install de fato usa; revertido. D67/D68.
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout do plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, mysqli
          ini-values: max_input_vars=5000
          coverage: none

      # Versão fixada diretamente (o plugin não versiona .nvmrc/package.json próprios -
      # o build AMD/grunt roda a partir do checkout do Moodle, não deste repositório).
      # 22.23.2 é a versão usada e verificada nas sessões de auditoria deste plugin.
      - name: Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Instalar moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci; pwd)/bin" >> $GITHUB_PATH
          echo "$(cd ci; pwd)/vendor/bin" >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8

      # A branch do Moodle e o tipo de banco são lidos por variável de ambiente
      # (MOODLE_BRANCH/DB), não por flag de linha de comando - "--moodle-branch"
      # não é uma opção reconhecida por "moodle-plugin-ci install" e falhava
      # (exit code 1) igualmente nas 12 combinações da matriz na primeira execução real.
      - name: Instalar Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: phplint
        run: moodle-plugin-ci phplint
      - name: phpcpd
        run: moodle-plugin-ci phpcpd
      - name: phpmd
        run: moodle-plugin-ci phpmd
      - name: codechecker (moodle-cs)
        run: moodle-plugin-ci codechecker
      - name: validate
        run: moodle-plugin-ci validate
      - name: savepoints
        run: moodle-plugin-ci savepoints
      # "mustache" não tem flag de tolerância a warning (confirmado: "--max-warnings"
      # não existe para este comando, só ["-m|--moodle MOODLE] [--] [<plugin>]").
      # Em vez de inventar outra flag, captura a saída e só tolera exatamente o
      # único falso positivo já conhecido e revisado deste projeto (fab.mustache,
      # aria-controls apontando para um id que só existe no template do painel,
      # fora do fragmento isolado que o linter renderiza sozinho) - qualquer
      # warning/erro diferente disso ainda falha o build. Ver DECISIONS.md D69.
      - name: mustache
        run: |
          set +e
          OUTPUT=$(moodle-plugin-ci mustache 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          FINDINGS=$(echo "$OUTPUT" | grep -c "WARNING:\|ERROR:")
          KNOWN=$(echo "$OUTPUT" | grep -c "fab\.mustache.*aria-controls")
          if [ "$FINDINGS" -ge 1 ] && [ "$FINDINGS" -eq "$KNOWN" ]; then
            echo "Só o falso positivo conhecido de fab.mustache - tolerado."
            exit 0
          fi
          exit $STATUS
      # "--tasks" aceita múltiplos valores repetindo a flag, não por vírgula
      # ("multiple values allowed" no --help) - "amd,yui,gherkinlint" como um
      # valor só foi lido como nome de UMA tarefa inexistente. D71.
      - name: grunt (eslint/AMD build/gherkin)
        run: moodle-plugin-ci grunt --tasks=amd --tasks=yui --tasks=gherkinlint
      # stylelint separado, não bloqueante: styles.css tem 129 declarações
      # !important, todas deliberadas (o plugin precisa sobrescrever CSS do
      # tema/Bootstrap do host, que já vem com alta especificidade) - já
      # revisadas e confirmadas sem mudança de contagem em auditorias
      # anteriores (audit/03-qualidade-desempenho.md). "moodle-plugin-ci
      # grunt" não expõe nenhuma forma de tolerar isso seletivamente
      # (--max-lint-warnings só vale para o eslint, confirmado no --help do
      # comando) - continua rodando e visível no log, só não derruba o build.
      # Ver DECISIONS.md D70.
      - name: grunt (stylelint - não bloqueante)
        run: moodle-plugin-ci grunt --tasks=stylelint
        continue-on-error: true
      - name: phpunit
        run: moodle-plugin-ci phpunit
      # Exclui @vlibras: esse cenário só passa num site com o plugin de
      # terceiros local_vlibras instalado, o que este CI nunca faz (é uma
      # integração opcional, desligada por padrão) - já era um gap conhecido
      # e aceito nos testes locais deste projeto ("Behat 4/5", DECISIONS.md
      # D64). Ver também DECISIONS.md D72.
      - name: behat
        run: moodle-plugin-ci behat --profile chrome --tags="@local_a11y&&~@vlibras"
