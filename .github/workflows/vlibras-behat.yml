name: VLibras Behat (optional)

# AUDIT-V2 finding SDLC-003: the @vlibras Behat scenario
# (tests/behat/vlibras_integration.feature) is excluded from the main
# ci.yml `test` job's "behat" step (`~@vlibras`) because that job never
# installs the third-party local_vlibras plugin the scenario needs - a
# deliberate, documented gap (DECISIONS.md D64/D72), not an oversight.
# This separate workflow gives that scenario a real, periodic run instead
# of leaving it with zero automated coverage: it installs local_vlibras
# from its own upstream repo (github.com/gfariasonline/moodle-local_vlibras
# - confirmed as the real source via classes/integration/vlibras.php's own
# docblock and this site's installed copy) alongside the plugin, then runs
# only the @vlibras-tagged scenario.
#
# Deliberately NOT part of ci.yml and NOT run on every push/PR:
# - It depends on a third-party repo this project doesn't control, so a
#   failure here (their side breaking, not ours) shouldn't block merges.
# - It only needs to catch regressions in the integration, not gate every
#   change - hence schedule + manual dispatch, not push/pull_request.
#
# Single PHP/DB combination only (not the full matrix) - this job exists
# for regression coverage, not compatibility-matrix validation (ci.yml's
# `test` job already does that for the plugin itself).
#
# Not yet verified against a real run at the time this was added - unlike
# the rest of this project's CI comments, which document real, executed
# evidence (see ci.yml's D66-D72 comments), this workflow's exact syntax
# (particularly `moodle-plugin-ci install`'s support for a second
# `--plugin` pointing at a non-Moodle-Plugins-Directory GitHub checkout)
# has not been confirmed by an actual green run yet. Treat the first few
# runs as verification, not as an established-working pipeline.

on:
  schedule:
    - cron: '17 6 * * 1' # Weekly, Monday 06:17 UTC - arbitrary off-peak time, not tied to any release cadence.
  workflow_dispatch: {}

jobs:
  vlibras-behat:
    runs-on: ubuntu-22.04
    continue-on-error: true # A failure here must never block this repo's own merges - see header comment.

    steps:
      - name: Checkout do plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Checkout do local_vlibras
        uses: actions/checkout@v7
        with:
          repository: gfariasonline/moodle-local_vlibras
          path: vlibras

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, zip, gd, mysqli
          ini-values: max_input_vars=5000
          coverage: none

      - name: Node.js 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Instalar moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci; pwd)/bin" >> $GITHUB_PATH
          echo "$(cd ci; pwd)/vendor/bin" >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8

      # Segundo --plugin instala local_vlibras junto com o plugin sob teste,
      # antes do Behat rodar - mesmo mecanismo usado por outros projetos
      # Moodle para dependências opcionais de terceiros em CI.
      - name: Instalar Moodle + plugin + local_vlibras
        run: moodle-plugin-ci install --plugin ./plugin --plugin ./vlibras --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: behat (@vlibras apenas)
        run: moodle-plugin-ci behat --profile chrome --tags="@local_a11y&&@vlibras"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
